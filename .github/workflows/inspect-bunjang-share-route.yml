name: Verify Bunjang shared product target
on:
  push:
    paths: ['.github/workflows/inspect-bunjang-share-route.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read official product deep link metadata
        run: |
          mkdir -p evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const report=[];
          for(const url of ['https://go.bgzt.link/remg97j','https://go.bgzt.link/mendsu7']){
            try{const r=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'},redirect:'manual',signal:AbortSignal.timeout(15000)}),html=await r.text();fs.writeFileSync('evidence/'+new URL(url).pathname.slice(1)+'.html',html);report.push({url,status:r.status,location:r.headers.get('location'),hits:[...html.matchAll(/.{0,100}(?:bunjang|deepLink|deeplink|scheme|intent|386933481|423628860).{0,300}/gi)].slice(0,80).map(m=>m[0])});}catch(e){report.push({url,error:e.message})}
          }fs.writeFileSync('evidence/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bunjang-share-link-target
          path: evidence/
          retention-days: 7
