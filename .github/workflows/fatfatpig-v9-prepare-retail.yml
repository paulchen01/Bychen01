name: Prepare retail and platform fee v9
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fatfatpig-v9-prepare-retail.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read pinned build recipe
        run: curl --fail --silent --show-error --max-time 40 'https://raw.githubusercontent.com/paulchen01/Bychen01/8333661b938095b9f399e29afac2e742dbef935d/korea-quote/releases/prepare-20260909-9.py' -o prepare.py
      - name: Build verified source snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python prepare.py
      - name: Save complete prepared source
        uses: actions/upload-artifact@v4
        with:
          name: fatfatpig-retail-fee-v9-prepared
          path: |
            prepared-site/
            prepared-v9.json
          retention-days: 7
