name: Prepare SmartStore self-service OCR beta v16
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fatfatpig-smartstore-beta-v16.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Build candidate from verified v15
        run: |
          curl --fail --silent --show-error --max-time 40 'https://raw.githubusercontent.com/paulchen01/Bychen01/76b93ddafcb6f06bf85c7ec4fe0d28518fd9f8dc/korea-quote/releases/build-20260911-16.mjs' -o build.mjs
          node build.mjs
          node --check .vercel/output/static/smartstore-beta.js
      - name: Install browser dependency and fonts
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk > /dev/null
      - name: Verify SmartStore self-service UI and price handoff
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import http from 'node:http';import path from 'node:path';import assert from 'node:assert/strict';import{chromium}from'playwright';import{createHash}from'node:crypto';
          const release=JSON.parse(fs.readFileSync('prepared-v16.json','utf8')),v15=await(await fetch('https://raw.githubusercontent.com/paulchen01/Bychen01/main/korea-quote/releases/site-20260911-15.json')).json();
          // Existing calculation/rate engine stays byte-identical to the already production-verified v15.
          for(const f of ['app.js','lib/estimate.mjs','lib/pricing.mjs','lib/sheet-rate.mjs','api/quote.js','api/rate.js'])assert.equal(release.hashes[f],v15.hashes[f],f+' changed unexpectedly');
          const server=http.createServer((req,res)=>{try{const p=new URL(req.url,'http://x').pathname;const f=path.join('.vercel/output/static',p==='/'?'index.html':p);const ext=path.extname(f);res.setHeader('content-type',ext==='.js'?'application/javascript':ext==='.css'?'text/css':ext==='.html'?'text/html':'application/octet-stream');res.end(fs.readFileSync(f));}catch(e){res.statusCode=404;res.end('not found')}});await new Promise(r=>server.listen(8765,'127.0.0.1',r));
          let browser;try{browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});for(const width of [393,320,1440]){const c=await browser.newContext({viewport:{width,height:1000}}),page=await c.newPage(),errs=[];page.on('pageerror',e=>errs.push(e.message));await page.route('https://cdn.jsdelivr.net/**',r=>r.abort());await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.__fatfatpigSmartstoreBeta);assert.equal(await page.locator('#smartstoreBeta').isVisible(),false);await page.locator('#url').fill('https://smartstore.naver.com/deco-deco/products/13749878148');await page.waitForFunction(()=>document.getElementById('smartstoreBeta').classList.contains('show'));const text=await page.locator('#smartstoreBeta').innerText();assert.ok(text.includes('韓文原文＋中文協助'));assert.ok(text.includes('分享已驗證的 Naver 分頁讀價'));assert.ok(text.includes('上傳商品頁截圖'));assert.equal(await page.locator('#ssOpen').getAttribute('href'),'https://smartstore.naver.com/deco-deco/products/13749878148');const parsed=await page.evaluate(()=>window.__fatfatpigSmartstoreBeta.priceCandidates('SALE 29,800 29,800 1980 13749878148 49,900'));assert.ok(parsed.includes(29800));assert.ok(parsed.includes(49900));assert.ok(!parsed.includes(13749878148));await page.evaluate(()=>window.__fatfatpigSmartstoreBeta.show([29800,49900],'test'));assert.equal(await page.locator('.ss-price').count(),2);await page.locator('.ss-price').first().click();assert.equal(await page.locator('#p').inputValue(),'29800');assert.ok(await page.locator('.manual-details').evaluate(el=>el.open));assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));assert.deepEqual(errs,[]);await page.locator('#smartstoreBeta').screenshot({path:'smartstore-beta-'+width+'.png'});await c.close();}console.log('SMARTSTORE_BETA_UI_TESTS_PASSED');}finally{if(browser)await browser.close();await new Promise(r=>server.close(r));}
          JS
      - name: Save tested release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import{createHash}from'node:crypto';
          const b=fs.readFileSync('prepared-v16.json');const r=await fetch('https://api.github.com/repos/paulchen01/Bychen01/contents/korea-quote/releases/site-20260911-16.json',{method:'PUT',headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Save tested SmartStore self-service OCR beta v16',content:b.toString('base64')})});const d=await r.json();assert.equal(r.status,201,JSON.stringify(d));console.log('V16_RELEASE_SAVED',d.commit.sha,createHash('sha256').update(b).digest('hex'));
          JS
      - name: Preserve candidate and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: fatfatpig-smartstore-beta-v16
          path: |
            .vercel/output/
            prepared-v16.json
            smartstore-beta-*.png
          retention-days: 14
