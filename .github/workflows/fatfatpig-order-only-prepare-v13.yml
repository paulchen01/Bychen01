name: Prepare order-only guidance card v13
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fatfatpig-order-only-prepare-v13.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read the pinned additive change
        run: |
          curl --fail --silent --show-error --max-time 30 'https://raw.githubusercontent.com/paulchen01/Bychen01/e2edc8d06a1aa491f855f48420c3bc92f9d65159/korea-quote/releases/prepare-20260911-13.mjs' -o prepare.mjs
          node prepare.mjs
      - name: Install isolated browser dependency and CJK fonts
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk > /dev/null
      - name: Check production baseline and test candidate UI with simulated rates
        run: |
          mkdir -p evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import http from 'node:http';import{createHash}from'node:crypto';import{chromium}from'playwright';
          const base='https://korea-quote-0908.vercel.app',hash=b=>createHash('sha256').update(b).digest('hex');
          const report={productionDeployed:false,sheetModified:false,baseline:[],simulatedRates:[]};
          const old=await(await fetch('https://raw.githubusercontent.com/paulchen01/Bychen01/24d3fe987558a0f43d9f065cf1d79c14bbdbd52c/korea-quote/releases/site-20260910-12.json')).json();
          for(const file of ['app.js','index.html','style.css','lib/platforms.mjs']){const r=await fetch(base+'/'+file,{cache:'no-store',signal:AbortSignal.timeout(15000)});assert.equal(r.status,200);const b=Buffer.from(await r.arrayBuffer());assert.equal(hash(b),old.hashes[file],'Production baseline changed: '+file);report.baseline.push(file);}
          const {estimateFromAmounts}=await import('./prepared-site/lib/estimate.mjs');
          const server=http.createServer((req,res)=>{try{const rel=new URL(req.url,'http://localhost').pathname,file=path.join('prepared-site',rel==='/'?'index.html':rel);const type={'.html':'text/html','.css':'text/css','.js':'application/javascript','.mjs':'application/javascript','.webp':'image/webp','.svg':'image/svg+xml','.png':'image/png'}[path.extname(file)];res.setHeader('Content-Type',type||'text/plain');res.end(fs.readFileSync(file));}catch{res.statusCode=404;res.end('Not found');}});await new Promise(r=>server.listen(8765,'127.0.0.1',r));
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          try{for(const width of [320,393,1440]){
            let rate=38.1,tick=0;const context=await browser.newContext({viewport:{width,height:1000},permissions:['clipboard-read','clipboard-write']}),page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.route('**/api/rate',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,version:'2026-09-11.13',exchangeRate:rate,checkedAt:new Date(Date.now()+(++tick)*1000).toISOString(),source:'google_sheets'})}));
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});await page.waitForFunction(()=>document.getElementById('rate').textContent==='38.1');assert.equal(await page.locator('#orderOnlyQuote').isVisible(),false);
            await page.locator('.manual-details summary').click();await page.locator('#p').fill('170000');await page.locator('#manual button').click();await page.locator('#result:not([hidden])').waitFor();
            assert.equal(await page.locator('#orderOnlyTitle').innerText(),'僅下單初步報價');assert.deepEqual(await page.locator('[data-order-only-rate]').allTextContents(),['38.1','38.1']);assert.ok((await page.locator('#orderOnlyQuote').innerText()).includes('以真人報價為主。'));assert.equal(await page.locator('.order-only-extra').innerText(),'＋ NT$50');
            const first=(await page.locator('#total').innerText());assert.equal(first,estimateFromAmounts(170000,null,null,38.1).totalTwd.toLocaleString('zh-TW'));
            rate=38.2;await page.locator('#refreshRate').click();await page.waitForFunction(()=>document.querySelector('[data-order-only-rate]').textContent==='38.2');assert.deepEqual(await page.locator('[data-current-rate]').allTextContents(),Array(4).fill('38.2'));assert.equal(await page.locator('#total').innerText(),first);assert.equal(await page.locator('#quoteRate').innerText(),'38.1');assert.ok(await page.locator('#quoteRateUpdate').isVisible());
            await page.locator('#reprice').click();await page.waitForFunction(()=>document.getElementById('quoteRate').textContent==='38.2');assert.equal(await page.locator('#total').innerText(),estimateFromAmounts(170000,null,null,38.2).totalTwd.toLocaleString('zh-TW'));
            await page.locator('#copy').click();const text=await page.evaluate(()=>navigator.clipboard.readText());assert.ok(text.includes('報價匯率：38.2'));assert.ok(!text.includes('僅下單'));assert.deepEqual(errors,[]);assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
            await page.locator('#orderOnlyQuote').screenshot({path:'evidence/card-'+width+'.png'});await page.locator('#result-panel').screenshot({path:'evidence/result-'+width+'.png'});report.simulatedRates.push({width,rates:[38.1,38.2],formulaSync:true,originalMathUnchanged:true,originalLineQuoteUnchanged:true,noOverflow:true});await context.close();
          }report.passed=true;console.log('CANDIDATE_TESTS_PASSED',JSON.stringify(report));}finally{fs.writeFileSync('evidence/report.json',JSON.stringify(report,null,2));await browser.close();await new Promise(r=>server.close(r));}
          JS
      - name: Save verified source release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import{createHash}from'node:crypto';
          const data=fs.readFileSync('prepared-v13.json');const r=await fetch('https://api.github.com/repos/paulchen01/Bychen01/contents/korea-quote/releases/site-20260911-13.json',{method:'PUT',headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Save tested order-only guidance v13 release; original quote arithmetic preserved',content:data.toString('base64')})});const d=await r.json();assert.equal(r.status,201,JSON.stringify(d));console.log('PREPARED_RELEASE',JSON.stringify({version:'2026-09-11.13',commit:d.commit.sha,sha256:createHash('sha256').update(data).digest('hex')}));
          JS
      - name: Save candidate files and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatfatpig-order-only-v13-prepared
          path: |
            prepared-site/
            prepared-v13.json
            evidence/
          retention-days: 14
