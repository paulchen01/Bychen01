name: Verify v10 customer wording on original production site
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fatfatpig-v10-copy-production.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install isolated browser and CJK font support
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk > /dev/null
      - name: Verify the original public hostname, text changes and unchanged calculations
        run: |
          mkdir -p evidence/source
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {chromium} from 'playwright';
          const base='https://korea-quote-0908.vercel.app',version='2026-09-09.10';
          const note='（本日匯率，匯率會浮動）',footer='本估價網頁僅為廢廢豬韓國代購之初步報價查詢，非各拍賣平台官方服務。';
          const report={base,version,deployment:'dpl_Ef5JADErdKt4fCHrvPS1Hez5AFwG',productionVerified:false,tests:[],sources:{}};
          let browser;
          try{
            let ready=false,last;
            for(let i=0;i<18;i++){
              try{const r=await fetch(base+'/api/health',{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(12000)}),d=await r.json();last=d;if(r.ok&&d.version===version){assert.equal(d.exchangeRate,38);assert.ok(d.platforms.some(p=>p.id==='musinsa'));assert.ok(d.platforms.some(p=>p.id==='oliveyoung'));report.health=d;ready=true;break;}}catch(e){last={error:e.message};}
              await new Promise(r=>setTimeout(r,4000));
            }
            assert.ok(ready,JSON.stringify(last));console.log('PUBLIC_VERSION_READY',JSON.stringify(report.health));
            const rr=await fetch('https://raw.githubusercontent.com/paulchen01/Bychen01/314275d94b0d6340a74ac3c942a8809ba96e7ec3/korea-quote/releases/site-20260909-10.json');assert.equal(rr.status,200);const raw=Buffer.from(await rr.arrayBuffer());const sha=b=>createHash('sha256').update(b).digest('hex');assert.equal(sha(raw),'d5c0db7d7ce67e36a7a65694e764ef4379a5dde81d1b3ce943a0eef9bde061da');const release=JSON.parse(raw);
            for(const[file,want]of Object.entries(release.hashes)){
              if(file.startsWith('api/')||file==='package.json')continue;
              const r=await fetch(base+'/'+file,{cache:'no-store',signal:AbortSignal.timeout(12000)});assert.equal(r.status,200,file);const b=Buffer.from(await r.arrayBuffer());assert.equal(sha(b),want,file);const p=path.join('evidence/source',file);fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,b);report.sources[file]=want;
            }
            const {normalize}=await import('./evidence/source/lib/platforms.mjs');
            assert.equal(normalize('https://m.oliveyoung.co.kr/m/goods/getGoodsDetail.do?goodsNo=A000000249451').platformId,'oliveyoung');assert.equal(normalize('https://www.musinsa.com/order/cart').kind,'cart');
            browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            for(const width of [393,1440,320]){
              const c=await browser.newContext({viewport:{width,height:900},permissions:['clipboard-read','clipboard-write']}),p=await c.newPage(),errors=[];p.on('pageerror',e=>errors.push(e.message));
              const r=await p.goto(base+'/?v=20260909-10',{waitUntil:'networkidle',timeout:30000});assert.equal(r.status(),200);await p.evaluate(()=>document.fonts.ready);
              assert.equal(await p.locator('#version').innerText(),version);assert.equal(await p.locator('.hero-pills').count(),0);assert.equal(await p.locator('footer p').innerText(),footer);assert.equal(await p.locator('.rate-note').count(),2);assert.deepEqual(await p.locator('.rate-note').allTextContents(),[note,note]);assert.equal(await p.locator('#rate').innerText(),'38');assert.equal(await p.evaluate(()=>document.querySelector('.hero').nextElementSibling.id),'quote-form');
              await p.screenshot({path:'evidence/home-'+width+'.png',fullPage:true});
              await p.locator('.manual-details summary').click();await p.locator('#p').fill('170000');await p.locator('#s').fill('');await p.locator('#pf').fill('');await p.locator('#manual button').click();
              assert.equal(await p.locator('#total').innerText(),'4,608');assert.equal(await p.locator('#platformFee').innerText(),'未標示，本次未計入');assert.equal(await p.locator('#shipping').innerText(),'未標示，本次未計入');assert.ok((await p.locator('#platformFeeNote').innerText()).startsWith('未標示，本次未計入'));
              const u=new URL(await p.locator('#lineInquiry').getAttribute('href')),text=decodeURIComponent(u.search.slice(1));assert.equal(decodeURIComponent(u.pathname),'/R/oaMessage/@fatfatpig_kr/');assert.ok(text.includes('韓國平台手續費：未標示，本次未計入'));assert.ok(text.includes('報價匯率：38'+note));await p.locator('#copy').click();assert.equal(await p.evaluate(()=>navigator.clipboard.readText()),text);
              assert.equal(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),true);assert.deepEqual(errors,[]);
              await p.locator('#result-panel').screenshot({path:'evidence/result-'+width+'.png'});await p.locator('.formula-card').screenshot({path:'evidence/formula-'+width+'.png'});await p.locator('footer').screenshot({path:'evidence/footer-'+width+'.png'});
              await p.locator('#p').fill('28000');await p.locator('#s').fill('4000');await p.locator('#pf').fill('1900');await p.locator('#manual button').click();assert.equal(await p.locator('#total').innerText(),'960');assert.equal(await p.locator('#platformFee').innerText(),'₩1,900');
              await p.locator('#pf').fill('0');await p.locator('#manual button').click();assert.equal(await p.locator('#total').innerText(),'910');assert.equal(await p.locator('#platformFee').innerText(),'₩0（已確認免平台費）');
              if(width===393){
                await p.locator('#url').fill('https://fruitsfamily.com/product/6gnwx/wearhouse-t');const pending=p.waitForResponse(r=>r.url().startsWith(base+'/api/quote?'),{timeout:65000});await p.locator('#go').click();const response=await pending,d=await response.json();report.liveProduct=d;assert.equal(response.status(),200);assert.equal(d.version,version);assert.ok(d.quote,JSON.stringify(d));await p.locator('#result:not([hidden])').waitFor();assert.equal(await p.locator('#total').innerText(),new Intl.NumberFormat('zh-TW').format(d.quote.totalTwd));assert.equal(await p.locator('#platformFee').innerText(),'未標示，本次未計入');await p.locator('#result-panel').screenshot({path:'evidence/fruits-live-393.png'});console.log('LIVE_FRUITS_QUOTE',JSON.stringify(d));
              }
              assert.deepEqual(errors,[]);report.tests.push({width,copyEditsPassed:true,unknownFeeTotal:4608,knownFeeTotal:960,zeroFeeTotal:910,lineCopyPassed:true,noOverflow:true,errors});await c.close();
            }
            report.productionVerified=true;report.checkedAt=new Date().toISOString();console.log('PRODUCTION_ACCEPTANCE_SUCCESS',JSON.stringify({base,version,tests:report.tests,checkedAt:report.checkedAt}));
          }catch(e){report.error={message:e.message,stack:e.stack};throw e;}finally{fs.writeFileSync('evidence/report.json',JSON.stringify(report,null,2));if(browser)await browser.close();}
          JS
      - name: Save public website screenshots and source checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatfatpig-v10-copy-production
          path: evidence/
          retention-days: 7
