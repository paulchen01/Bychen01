name: Prepare Korean Bunjang app links v24
on:
  push:
    paths: ['.github/workflows/fatfatpig-bunjang-links-v24.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply guarded link-only patch and align asset-version assertions
        run: |
          node korea-quote/scripts/prepare-bunjang-links-v24.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const file='korea-quote/site/tests/auto-quote.test.mjs',s=fs.readFileSync(file,'utf8');
          assert.equal((s.match(/20261019-23/g)||[]).length,3);
          assert.equal((s.match(/2026-10-19\.23/g)||[]).length,1);
          fs.writeFileSync(file,s.replaceAll('20261019-23','20261026-24').replaceAll('2026-10-19.23','2026-10-26.24'));
          JS
      - name: Run all existing and additional regression tests
        working-directory: korea-quote/site
        run: |
          mkdir -p evidence
          npm ci --ignore-scripts --no-audit --no-fund
          set -o pipefail
          npm test | tee evidence/tests.txt
          npm run build
      - name: Validate release has not changed pricing or fetching
        run: |
          node korea-quote/scripts/release.mjs
          node korea-quote/scripts/release.mjs --check
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/pig-browser --ignore-scripts --no-audit --no-fund playwright@1.55.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk > /dev/null
      - name: Check candidate mobile and desktop link UI
        working-directory: korea-quote/site
        run: node tests/bunjang-links-browser.mjs
      - name: Save tested source and release atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp korea-quote/site/evidence/bunjang-links-report.json korea-quote/releases/candidate-bunjang-links-20261026-24.json
          git add korea-quote/site/app.js korea-quote/site/index.html korea-quote/site/style.css korea-quote/site/lib/bunjang-links.mjs korea-quote/site/lib/quote-text.mjs korea-quote/site/lib/platforms.mjs korea-quote/site/package.json korea-quote/site/package-lock.json korea-quote/site/README.md korea-quote/site/tests/bunjang-links.test.mjs korea-quote/site/tests/auto-quote.test.mjs korea-quote/site/tests/run-tests.mjs korea-quote/scripts/release.mjs korea-quote/releases/site-20261026-24.json korea-quote/releases/candidate-bunjang-links-20261026-24.json
          git commit -m 'Add tested Bunjang Korean app entry and clean same-product links (v24; deployment pending)'
          git push origin HEAD:main
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fatfatpig-bunjang-links-v24-candidate
          path: |
            korea-quote/site/evidence/
            korea-quote/site/
            korea-quote/releases/site-20261026-24.json
            !korea-quote/site/node_modules/
          include-hidden-files: true
          retention-days: 14
