name: Verify live order title and Korean-address description v15
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fatfatpig-order-address-production-v15.yml']
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Reproduce approved text-only release
        run: |
          curl --fail --silent --show-error --max-time 40 'https://raw.githubusercontent.com/paulchen01/Bychen01/1247efddabdb6746ae3d92020cd61449505bf815/korea-quote/releases/build-20260911-15.mjs' -o build.mjs
          node build.mjs
      - name: Install isolated browser verification dependency
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk > /dev/null
      - name: Verify original public website, exact words, live rate and mobile layout
        run: |
          mkdir -p evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import{createHash}from'node:crypto';import{chromium}from'playwright';
          const base='https://korea-quote-0908.vercel.app',version='2026-09-11.15',sha=b=>createHash('sha256').update(b).digest('hex');
          const release=JSON.parse(fs.readFileSync('prepared-v15.json','utf8'));assert.equal(sha(fs.readFileSync('prepared-v15.json')),'0c29819a70f9ebfda47ce1eed071a6bbe958c874c3b87165a19fcde21059b3ea');
          const report={base,version,deploymentId:'dpl_4BV5JZo2Uz6FeDYi933bnLWNxyLP',productionVerified:false,sheetModified:false,sourceHashesMatched:[],browser:[]};let browser;
          const get=async url=>{const r=await fetch(url,{cache:'no-store',redirect:'manual',signal:AbortSignal.timeout(15000)});return{r,b:Buffer.from(await r.arrayBuffer())};};
          try{
            let ready=false,last;
            for(let i=0;i<15;i++){try{const{r,b}=await get(base+'/api/rate'),d=JSON.parse(b);last=d;if(r.ok&&d.ok&&d.version===version){ready=true;report.rate=d;break;}}catch(e){last={error:e.message};}await new Promise(r=>setTimeout(r,4000));}
            assert.ok(ready,'Original public hostname was not updated: '+JSON.stringify(last));
            for(const[file,want]of Object.entries(release.hashes)){if(file.startsWith('api/')||file==='package.json')continue;const{r,b}=await get(base+'/'+file);assert.equal(r.status,200,file);assert.equal(sha(b),want,file);report.sourceHashesMatched.push(file);}
            const{r,b}=await get(base+'/?v=20260911-15');assert.equal(r.status,200);const html=b.toString('utf8');assert.ok(html.includes('id="orderOnlyTitle">代下單初步報價</h4>'));assert.ok(html.includes('（協助下單寄您提供的韓國地址）'));assert.ok(!html.includes('僅下單'));assert.ok(html.includes('本框為「代下單」計價說明'));
            const{estimateFromAmounts}=await import('./.vercel/output/static/lib/estimate.mjs');
            browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            for(const width of [393,320,1440]){
              const ctx=await browser.newContext({viewport:{width,height:1000},permissions:['clipboard-read','clipboard-write']}),page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.message));
              const waiting=page.waitForResponse(r=>r.url()===base+'/api/rate');const home=await page.goto(base+'/?v=20260911-15',{waitUntil:'networkidle',timeout:30000});assert.equal(home.status(),200);const rate=await(await waiting).json();assert.equal(rate.version,version);await page.waitForFunction(n=>document.getElementById('rate').textContent===String(n),rate.exchangeRate);await page.evaluate(()=>document.fonts.ready);
              assert.equal(await page.locator('#version').innerText(),version);
              await page.locator('.manual-details summary').click();await page.locator('#p').fill('170000');await page.locator('#s').fill('');await page.locator('#pf').fill('');await page.locator('#manual button').click();await page.locator('#result:not([hidden])').waitFor();
              assert.equal(await page.locator('#orderOnlyTitle').innerText(),'代下單初步報價');assert.equal(await page.locator('#orderOnlySubtitle').innerText(),'（協助下單寄您提供的韓國地址）');assert.equal(await page.locator('.order-only-extra').innerText(),'＋ NT$50');assert.ok(!(await page.locator('body').innerText()).includes('僅下單'));
              const qrate=Number(await page.locator('#quoteRate').innerText()),q=estimateFromAmounts(170000,null,null,qrate);assert.equal(await page.locator('#total').innerText(),q.totalTwd.toLocaleString('zh-TW'));assert.deepEqual(await page.locator('[data-order-only-rate]').allTextContents(),[String(qrate),String(qrate)]);
              const line=new URL(await page.locator('#lineInquiry').getAttribute('href')),text=decodeURIComponent(line.search.slice(1));assert.equal(decodeURIComponent(line.pathname),'/R/oaMessage/@fatfatpig_kr/');assert.ok(text.includes('報價匯率：'+qrate));await page.locator('#copy').click();assert.equal(await page.evaluate(()=>navigator.clipboard.readText()),text);
              assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));assert.deepEqual(errors,[]);
              await page.locator('#orderOnlyQuote').screenshot({path:'evidence/live-card-'+width+'.png'});await page.locator('#result-panel').screenshot({path:'evidence/live-result-'+width+'.png'});
              report.browser.push({width,title:'代下單初步報價',subtitle:'（協助下單寄您提供的韓國地址）',rate:qrate,total:q.totalTwd,copyAndLineVerified:true,noOverflow:true});await ctx.close();
            }
            report.productionVerified=true;report.checkedAt=new Date().toISOString();console.log('LIVE_V15_CONFIRMED',JSON.stringify(report));
          }catch(e){report.error={message:e.message,stack:e.stack};throw e;}finally{fs.writeFileSync('evidence/report.json',JSON.stringify(report,null,2));if(browser)await browser.close();}
          JS
      - name: Save verified release and concise production receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const report=JSON.parse(fs.readFileSync('evidence/report.json','utf8'));assert.equal(report.productionVerified,true);
          for(const [name,data] of [['site-20260911-15.json',fs.readFileSync('prepared-v15.json')],['acceptance-20260911-15.json',Buffer.from(JSON.stringify(report,null,2))]]){
            const r=await fetch('https://api.github.com/repos/paulchen01/Bychen01/contents/korea-quote/releases/'+name,{method:'PUT',headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Preserve verified live 代下單 title and address description v15',content:data.toString('base64')})});const d=await r.json();assert.equal(r.status,201,JSON.stringify(d));console.log('SAVED_VERIFIED_RELEASE',name,d.commit.sha);
          }
          JS
      - name: Preserve actual public website screenshots and check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatfatpig-order-address-v15-production
          path: |
            evidence/
            prepared-v15.json
          retention-days: 14
