name: Fat Fat Pig brand and LINE acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fatfatpig-brand-check.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install browser dependency and CJK system fonts
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Run the previously reviewed pinned acceptance script on the actual production site
        run: |
          mkdir -p acceptance/source/lib acceptance/source/assets
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request, textwrap
          source='https://raw.githubusercontent.com/paulchen01/Bychen01/d21a295162cd6ba3005d4319237c89a5e9649723/.github/workflows/fatfatpig-brand-check.yml'
          with urllib.request.urlopen(source,timeout=20) as response:
              workflow=response.read().decode('utf-8')
          script=workflow.split("node --input-type=module <<'JS'\n",1)[1].split('\n          JS',1)[0]
          Path('acceptance-run.mjs').write_text(textwrap.dedent(script),encoding='utf-8')
          PY
          node acceptance-run.mjs
      - name: Save screenshots and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatfatpig-brand-live-acceptance
          path: acceptance/
          retention-days: 7
