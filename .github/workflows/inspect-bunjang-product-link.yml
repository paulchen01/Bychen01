name: Verify Bunjang product app route
on:
  push:
    paths: ['.github/workflows/inspect-bunjang-product-link.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read official navigation helpers
        run: |
          mkdir -p evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const root='https://m.bunjang.co.kr/static/js/',files=['product.WN5yGaAz.chunk.js','resolve-text-link.CNCSEKhl.chunk.js','AppNudgePopup.aWHNtYHM.chunk.js','useDotButton.BYvrybDZ.chunk.js','index.CvbFdxMw.chunk.js','index.DpaUn-yG.chunk.js','index.sJpCHpyU.chunk.js','index.CTIuay0X.chunk.js','chunk.BN1TkZLu.chunk.js'],report=[];
          for(let i=0;i<files.length;i++){
            const url=root+files[i];try{const r=await fetch(url,{signal:AbortSignal.timeout(12000)}),text=await r.text();fs.writeFileSync('evidence/chunk-'+i+'.js',text);const hits=[...text.matchAll(/.{0,200}(?:goToProduct|generateDeepLink|bunjang:\/\/|intent:\/\/|deepLink|deeplink|shortLink|val:).{0,400}/g)].slice(0,40).map(m=>m[0]);report.push({url,status:r.status,hits});}catch(e){report.push({url,error:e.message});}
          }
          fs.writeFileSync('evidence/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bunjang-product-app-route
          path: evidence/
          retention-days: 7
