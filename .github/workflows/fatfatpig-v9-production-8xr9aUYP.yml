name: Verify original public production v9 after reconnect
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fatfatpig-v9-production-8xr9aUYP.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install browser and CJK fonts
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk > /dev/null
      - name: Verify original public hostname and live product results
        run: |
          mkdir -p evidence/source/lib evidence/source/assets
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {chromium} from 'playwright';
          const base='https://korea-quote-0908.vercel.app',version='2026-09-09.9';
          const report={base,version,deploymentId:'dpl_8xr9aUYPq2DvfxKkrc1unCmdmNAD',productionVerified:false,sources:{},api:[],browser:[]};
          let browser;
          const log=(name,data)=>console.log(name,JSON.stringify(data));
          const sha=b=>createHash('sha256').update(b).digest('hex');
          try {
            let ready=false,last;
            for(let i=0;i<20;i++){
              try{
                const r=await fetch(base+'/api/health',{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(12000)}),text=await r.text();
                last={status:r.status,location:r.headers.get('location'),body:text.slice(0,2000)};
                if(r.ok){const h=JSON.parse(text);if(h.version===version){assert.equal(h.exchangeRate,38);assert.ok(h.platforms.some(p=>p.id==='musinsa'));assert.ok(h.platforms.some(p=>p.id==='oliveyoung'));assert.equal(h.platformFeePolicy,'separate-pass-through-unknown-excluded');report.health=h;ready=true;log('PRODUCTION_READY',h);break;}}
              }catch(e){last={error:e.message};}
              await new Promise(r=>setTimeout(r,4000));
            }
            assert.ok(ready,'Original public hostname not updated: '+JSON.stringify(last));
            const rr=await fetch('https://raw.githubusercontent.com/paulchen01/Bychen01/6950cc6755514fc5bd2a3d2d36d0d4691bc37536/korea-quote/releases/site-20260909-9.json',{signal:AbortSignal.timeout(15000)});
            assert.equal(rr.status,200);const raw=Buffer.from(await rr.arrayBuffer());assert.equal(sha(raw),'603b54dfe5d386d247f023c0e70024dec96497a96936d464752a47537b1210f3');const release=JSON.parse(raw);
            for(const [file,want] of Object.entries(release.hashes)){
              if(file.startsWith('api/')||file==='package.json')continue;
              const r=await fetch(base+'/'+file,{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(15000)});assert.equal(r.status,200,file);const b=Buffer.from(await r.arrayBuffer());assert.equal(sha(b),want,file+' differs from approved source');
              const local=path.join('evidence/source',file);fs.mkdirSync(path.dirname(local),{recursive:true});fs.writeFileSync(local,b);report.sources[file]=want;
            }
            log('ALL_PUBLIC_SOURCE_HASHES_MATCH',report.sources);
            const {quoteForProduct}=await import('./evidence/source/lib/estimate.mjs');
            const inputs=[
              ['olive','https://m.oliveyoung.co.kr/m/goods/getGoodsDetail.do?goodsNo=A000000249451&t_page=브랜드관&t_click=테마별+상품+전시&t_number=1&trackingCd=Brand_ThemeShowcase_Product'],
              ['musinsa','https://www.musinsa.com/products/484461'],
              ['cart','https://www.musinsa.com/order/cart'],
              ['fruits','https://fruitsfamily.com/product/6gnwx/wearhouse-t'],
              ['bunjang','https://globalbunjang.com/product/405399188']
            ];
            browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const ctx=await browser.newContext({viewport:{width:393,height:900},permissions:['clipboard-read','clipboard-write']});
            const page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.message));
            const home=await page.goto(base+'/?v=20260909-9',{waitUntil:'networkidle',timeout:30000});assert.equal(home.status(),200);assert.ok(page.url().startsWith(base+'/'));await page.evaluate(()=>document.fonts.ready);
            assert.equal(await page.locator('#version').innerText(),version);assert.equal(await page.evaluate(()=>document.querySelector('.hero').nextElementSibling.id),'quote-form');
            await page.screenshot({path:'evidence/home-393.png',fullPage:true});
            for(const [name,url] of inputs){
              await page.locator('#url').fill(url);
              const pending=page.waitForResponse(r=>r.url().startsWith(base+'/api/quote?'),{timeout:65000});await page.locator('#go').click();
              const response=await pending,d=await response.json();report.api.push({name,input:url,status:response.status(),response:d});log('LIVE_PRODUCT',report.api.at(-1));
              assert.equal(response.status(),200);assert.equal(d.ok,true);assert.equal(d.version,version);await page.locator('#result:not([hidden])').waitFor();
              if(name==='cart'){
                assert.equal(d.product.kind,'cart');assert.equal(d.quote,null);assert.equal(d.product.priceKrw,null);assert.ok((await page.locator('#pendingReason').innerText()).includes('購物車'));
              }else{
                assert.ok(d.quote,name+': '+JSON.stringify(d));assert.equal(d.product.currency,'KRW');assert.equal(d.quote.totalTwd,quoteForProduct(d.product).totalTwd);assert.equal(await page.locator('#total').innerText(),new Intl.NumberFormat('zh-TW').format(d.quote.totalTwd));
                assert.ok(await page.locator('#platformFee').isVisible());if(d.quote.platformFeeKrw===null)assert.ok((await page.locator('#platformFee').innerText()).includes('讀不到'));
              }
              const line=new URL(await page.locator('#lineInquiry').getAttribute('href')),text=decodeURIComponent(line.search.slice(1));
              assert.equal(decodeURIComponent(line.pathname),'/R/oaMessage/@fatfatpig_kr/');assert.ok(text.includes('韓國平台手續費'));
              if(name==='musinsa'||name==='cart')assert.ok(text.includes('因常有折扣，故真人報價應能更便宜，以實際報價為主'));
              await page.locator('#copy').click();assert.equal(await page.evaluate(()=>navigator.clipboard.readText()),text);
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),true);assert.deepEqual(errors,[]);
              await page.locator('#result-panel').screenshot({path:'evidence/'+name+'-393.png'});
            }
            await ctx.close();
            for(const width of [393,1440,320]){
              const c=await browser.newContext({viewport:{width,height:900},permissions:['clipboard-read','clipboard-write']}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(e.message));
              await p.goto(base+'/?v=20260909-9',{waitUntil:'networkidle',timeout:30000});assert.equal(await p.locator('#version').innerText(),version);await p.locator('.manual-details summary').click();await p.locator('#p').fill('28000');await p.locator('#s').fill('4000');await p.locator('#pf').fill('1900');await p.locator('#manual button').click();
              assert.equal(await p.locator('#total').innerText(),'960');assert.equal(await p.locator('#platformFee').innerText(),'₩1,900');await p.locator('#copy').click();assert.ok((await p.evaluate(()=>navigator.clipboard.readText())).includes('韓國平台手續費：₩1,900'));
              await p.locator('#pf').fill('');await p.locator('#manual button').click();assert.equal(await p.locator('#total').innerText(),'910');assert.ok((await p.locator('#platformFee').innerText()).includes('讀不到'));
              assert.equal(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),true);assert.deepEqual(errs,[]);
              report.browser.push({width,knownFeeTotal:960,unknownFeeTotal:910,copyPassed:true,noOverflow:true,errors:errs});log('LIVE_BROWSER_PASS',report.browser.at(-1));await c.close();
            }
            report.productionVerified=true;report.checkedAt=new Date().toISOString();log('PRODUCTION_ACCEPTANCE_SUCCESS',{base,version,checkedAt:report.checkedAt});
          }catch(e){report.error={message:e.message,stack:e.stack};throw e;}finally{fs.writeFileSync('evidence/report.json',JSON.stringify(report,null,2));if(browser)await browser.close();}
          JS
      - name: Save actual production verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatfatpig-v9-production-8xr9aUYP
          path: evidence/
          retention-days: 7
